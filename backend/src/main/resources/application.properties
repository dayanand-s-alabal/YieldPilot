server.port=8081
spring.application.name=yieldpilot-backend

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/yieldpilot_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Dayanand@123

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# YieldPilot Scheduler Settings
yieldpilot.scheduler.enabled=true
yieldpilot.scheduler.snapshot-rate-ms=300000
yieldpilot.scheduler.rebalance-rate-ms=600000